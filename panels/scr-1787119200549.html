:root {
  --primary: #4a9eff;
  --primary-hover: #357abd;

  --surface-texture-position: 0 0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-family);
  background-color: var(--bg-main);
  color: var(--text);
  line-height: 1.5;
}

body {

  flex-direction: column;
}

.shell-container {

  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.header {

  align-items: center;
  justify-content: space-between;

}

.logo {

  font-weight: 600;
  color: var(--primary);
  letter-spacing: -0.5px;
}

.header-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
}

.header-right {
  display: flex;
  align-items: center;
  gap: calc(var(--space-unit) * 1.5);
}

.user-avatar {

  height: 32px;
  border-radius: 50%;
  background-color: var(--primary);

  align-items: center;
  justify-content: center;

  color: #fff;

}

.user-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}

.logout-link {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  transition: color var(--motion-duration);
}

.logout-link:hover {
  color: var(--primary);
}

.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 64px;
}

.content-area > div[data-aivic-panel] {
  width: 100%;
  height: 100%;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: var(--bg-card);
  border-top: var(--border-width) solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 64px;
  flex-shrink: 0;
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  padding: calc(var(--space-unit) * 0.75) calc(var(--space-unit) * 1.5);
  text-decoration: none;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 500;
  transition: color var(--motion-duration);
  flex: 1;
  height: 100%;
}

.nav-item:hover {
  color: var(--primary);
}

.nav-item.aivic-active {
  color: var(--primary);
  border-top: 2px solid var(--primary);
}

.nav-icon {
  font-size: 20px;
  line-height: 1;
}

.toast-container {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  pointer-events: none;
}

.toast {
  background-color: var(--bg-card);
  color: var(--text);
  padding: calc(var(--space-unit) * 1.5) calc(var(--space-unit) * 2);
  border-radius: var(--radius-card);
  border: var(--border-width) solid var(--border);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-card);
  pointer-events: auto;
  animation: slideUp var(--motion-duration) ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background-color: var(--bg-card);
  border-radius: var(--radius-card);
  padding: calc(var(--space-unit) * 2);
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-card);
  border: var(--border-width) solid var(--border);
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: calc(var(--space-unit) * 1.5);
  color: var(--text);
}

.modal-close {
  position: absolute;
  top: calc(var(--space-unit) * 1.5);
  right: calc(var(--space-unit) * 1.5);
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
  transition: color var(--motion-duration);
}

.modal-close:hover {
  color: var(--text);
}

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const overlay = container.querySelector('#reminder-confirm-overlay');\n  const detailOverlay = container.querySelector('#detail-modal-overlay');\n  const sendReminderBtn = container.querySelector('#send-reminder-btn');\n  const reminderCancelBtn = container.querySelector('#reminder-cancel-btn');\n  const reminderConfirmBtn = container.querySelector('#reminder-confirm-btn');\n  const detailCloseBtn = container.querySelector('#detail-close-btn');\n  const detailViewFullBtn = container.querySelector('#detail-view-full-btn');\n\n  let unsubmittedUsers = [];\n  let selectedIssueId = null;\n\n  // 自動更新タイマー\n  let autoRefreshTimer = null;\n\n  // 初期化: データ取得と描画\n  async function init() {\n    await refreshDashboard();\n    // 30秒ごとに自動更新\n    autoRefreshTimer = setInterval(refreshDashboard, 30000);\n  }\n\n  // ダッシュボード全体を更新\n  async function refreshDashboard() {\n    try {\n      // 報告提出状況を取得\n      const submissionStatus = await window.aivicApi.list(4); // 報告提出状況テーブル\n      if (!submissionStatus) return;\n\n      // ユーザー情報を取得\n      const users = await window.aivicApi.list(0); // ユーザーテーブル\n      if (!users) return;\n\n      // 課題抽出結果を取得\n      const issues = await window.aivicApi.list(6); // 課題抽出結果テーブル\n      if (!issues) return;\n\n      // 課題優先度スコアを取得\n      const priorityScores = await window.aivicApi.list(7); // 課題優先度スコアテーブル\n      if (!priorityScores) return;\n\n      // 提出状況の集計\n      const submitted = submissionStatus.filter(s => s.提出状況 === '提出済み').length;\n      const unsubmitted = submissionStatus.filter(s => s.提出状況 === '未提出').length;\n\n      container.querySelector('[data-testid=\"submitted-count\"]').textContent = submitted;\n      container.querySelector('[data-testid=\"unsubmitted-count\"]').textContent = unsubmitted;\n\n      // 未提出メンバー一覧を構築\n      unsubmittedUsers = submissionStatus\n        .filter(s => s.提出状況 === '未提出')\n        .map(s => {\n          const user = users.find(u => u.ユーザーID === s.ユーザーID);\n          return { ...s, userName: user ? user.表示名 : '不明' };\n        });\n\n      renderUnsubmittedList();\n\n      // 優先度別課題一覧を構築（スコアでソート）\n      const issuesWithScore = issues.map(issue => {\n        const score = priorityScores.find(ps => ps.課題抽出結果ID === issue.課題抽出結果ID);\n        return { ...issue, scoreValue: score ? score.優先度スコア : 0 };\n      }).sort((a, b) => b.scoreValue - a.scoreValue);\n\n      renderIssuesList(issuesWithScore, users);\n\n      // 高優先度課題（スコア >= 70）をハイライト\n      const highPriorityIssues = issuesWithScore.filter(i => i.scoreValue >= 70);\n      if (highPriorityIssues.length > 0) {\n        container.querySelector('#high-priority-section').style.display = 'flex';\n        renderHighPriorityIssues(highPriorityIssues, users);\n      } else {\n        container.querySelector('#high-priority-section').style.display = 'none';\n      }\n\n    } catch (error) {\n      console.error('Dashboard refresh error:', error);\n    }\n  }\n\n  // 未提出メンバー一覧を描画\n  function renderUnsubmittedList() {\n    const listContainer = container.querySelector('#unsubmitted-list');\n    const emptyMsg = container.querySelector('#unsubmitted-empty');\n\n    if (unsubmittedUsers.length === 0) {\n      listContainer.innerHTML = '';\n      emptyMsg.style.display = 'block';\n      return;\n    }\n\n    emptyMsg.style.display = 'none';\n    listContainer.innerHTML = unsubmittedUsers.map(user => `\n      <div style=\"padding: 10px 12px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;\">\n        <span style=\"color: var(--text);\">${user.userName}</span>\n        <span style=\"color: var(--text-muted); font-size: 11px;\">未提出</span>\n      </div>\n    `).join('');\n  }\n\n  // 優先度別課題一覧を描画\n  function renderIssuesList(issuesWithScore, users) {\n    const listContainer = container.querySelector('#issues-list');\n    const emptyMsg = container.querySelector('#issues-empty');\n\n    if (issuesWithScore.length === 0) {\n      listContainer.innerHTML = '';\n      emptyMsg.style.display = 'block';\n      return;\n    }\n\n    emptyMsg.style.display = 'none';\n    listContainer.innerHTML = issuesWithScore.slice(0, 5).map(issue => {\n      const priorityColor = issue.優先度 === '高' ? '#ff6b6b' : issue.優先度 === '中' ? '#ffd93d' : '#8a92a8';\n      const user = users.find(u => u.ユーザーID === issue.担当者ID);\n      return `\n        <div \n          class=\"issue-card\" \n          data-id=\"${issue.課題抽出結果ID}\"\n          style=\"padding: 12px; background: var(--bg-main); border-left: 3px solid ${priorityColor}; border-radius: 4px; cursor: pointer; transition: background 200ms; font-size: 12px;\">\n          <div style=\"color: var(--text); margin-bottom: 4px; font-weight: 500; word-break: break-word;\">${issue.課題内容}</div>\n          <div style=\"color: var(--text-muted); font-size: 11px;\">\n            優先度: ${issue.優先度} | スコア: ${issue.scoreValue}\n          </div>\n        </div>\n      `;\n    }).join('');\n\n    // 課題カードのクリックイベント\n    listContainer.querySelectorAll('.issue-card').forEach(card => {\n      card.addEventListener('click', () => {\n        selectedIssueId = card.dataset.id;\n        showDetailModal(issuesWithScore.find(i => i.課題抽出結果ID === selectedIssueId), users);\n      });\n    });\n  }\n\n  // 高優先度課題をハイライト表示\n  function renderHighPriorityIssues(highPriorityIssues, users) {\n    const listContainer = container.querySelector('#high-priority-list');\n    listContainer.innerHTML = highPriorityIssues.slice(0, 3).map(issue => {\n      const user = users.find(u => u.ユーザーID === issue.担当者ID);\n      return `\n        <div \n          class=\"high-priority-card\" \n          data-id=\"${issue.課題抽出結果ID}\"\n          style=\"padding: 12px; background: rgba(255, 107, 107, 0.1); border: 1px solid #ff6b6b; border-radius: 6px; cursor: pointer; transition: background 200ms; font-size: 12px;\">\n          <div style=\"color: #f ddEventListener('click', () => {\n    const countText = container.querySelector('#reminder-count-text');\n    countText.textContent = `未提出メンバー ${unsubmittedUsers.length} 名にメールを送信します。`;\n    overlay.style.display = 'flex';\n  });\n\n  // リマインド送信キャンセル\n  reminderCancelBtn.addEventListener('click', () => {\n    overlay.style.display = 'none';\n  });\n\n  // リマインド送信確認\n  reminderConfirmBtn.addEventListener('click', async () => {\n    overlay.style.display = 'none';\n    try {\n      // リマインド通知履歴を作成（簡略版: 実際にはメール送信処理が必要）\n      for (const user of unsubmittedUsers) {\n        await window.aivicApi.save(8, {\n          ユーザーID: user.ユーザーID,\n          朝会報告ID: user.朝会報告ID || '',\n          通知タイプ: 'リマインド',\n          通知方法: 'メール',\n          送信日時: new Date().toISOString(),\n          送信ステータス: '成功'\n        });\n      }\n      // 成功通知（シェルの toast 機能を使用）\n      if (window.showToast) {\n        window.showToast(`${unsubmittedUsers.length} 名にリマインドを送信しました`, 'success');\n      }\n      // ダッシュボード更新\n      await refreshDashboard();\n    } catch (error) {\n      console.error('Reminder send error:', error);\n      if (window.showToast) {\n        window.showToast('リマインド送信に失敗しました', 'error');\n      }\n    }\n  });\n\n  // 詳細モーダルを閉じる\n  detailCloseBtn.addEventListener('click', () => {\n    detailOverlay.style.display = 'none';\n  });\n\n  // 詳細確認ボタン（日報確認・検索画面へ遷移）\n  detailViewFullBtn.addEventListener('click', () => {\n    detailOverlay.style.display = 'none';\n    window.showScreen('scr-1787119221707');\n  });\n\n  // Esc キーでモーダルを閉じる\n  document.addEventListener('keydown', (e) => {\n    if (e.key === 'Escape') {\n      overlay.style.display = 'none';\n      detailOverlay.style.display = 'none';\n    }\n  });\n\n  // overlay 背景クリックで閉じる\n  overlay.addEventListener('click', (e) => {\n    if (e.target === overlay) {\n      overlay.style.display = 'none';\n    }\n  });\n\n  detailOverlay.addEventListener('click', (e) => {\n    if (e.target === detailOverlay) {\n      detailOverlay.style.display = 'none';\n    }\n  });\n\n  // 初期化実行\n  init();\n}";

      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // AI シェルが SPA 用の初期表示処理を持っていても、マルチページでは
    // このファイルに割り当てられた画面だけを表示する。
    document.querySelectorAll('[data-aivic-panel]').forEach(function(panel) {
      var isCurrent = panel.getAttribute('data-aivic-panel') === pageScreenId;
      panel.style.display = isCurrent ? 'block' : 'none';
    });

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
</body>
</html>
